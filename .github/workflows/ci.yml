name: CI

on:
  pull_request:

env:
  NODE_VERSION: '24'

jobs:
  checks:
    name: Format, lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --immutable

      - run: yarn generate

      - run: yarn format:check

      - run: yarn lint

      - run: yarn typecheck

      - run: yarn test:unit

  integration-and-e2e:
    name: Integration and e2e tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --immutable

      - run: yarn generate

      - run: docker compose up -d --wait

      - run: yarn workspace server prisma migrate deploy

      - run: yarn workspace server migrate:e2e-db

      - run: yarn test:integration

      - run: yarn test:e2e

  fault-tolerance:
    name: Fault-tolerance tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - run: yarn install --immutable

      - run: yarn generate

      - run: docker compose up -d --wait

      - run: yarn workspace server prisma migrate deploy

      - run: yarn workspace server migrate:e2e-db

      - run: yarn test:fault-tolerance
